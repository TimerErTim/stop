#:schema https://mise.jdx.dev/schema/mise-task.json

["run:gui"]
description = "Start the stop GUI demo"
raw_args = true
raw = true
run = "cargo run -p stop-gui --release --"

["run:bench"]
description = "Run all dataset cases against the configured model (cases already in the output file are skipped; new results append)"
dir = "{{cwd}}"
raw = true
usage = """
flag "--output <file>" default="data/benchmark_results.jsonl"
"""
sources = ["data/test_suite.jsonl"]
outputs = ["{{ usage.output }}"]
run = """
cargo run -p stop-benchmark --release -- --input "{{ config_root }}/data/test_suite.jsonl" --output {{ usage.output }}
"""
