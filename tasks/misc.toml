#:schema https://mise.jdx.dev/schema/mise-task.json

["dataset:generate"]
description = "Generate the synthetic ground-truth dataset (incl. noise transcripts)"
run = "cargo run -p stop-dataset -- --count 250 --output data/test_suite.jsonl --scenarios \"cholecystectomy,hernia_repair,appendectomy\" --noise-ratio 0.5"

["bench:run"]
description = "Run all dataset cases against the local JevK5 instance"
run = "cargo run -p stop-benchmark --bin run-benchmark -- --input data/test_suite.jsonl --output data/benchmark_results.jsonl"

["bench:eval-accuracy"]
depends = ["bench:run"]
run = "cargo run -p stop-benchmark --bin eval-accuracy -- --input data/benchmark_results.jsonl"

["bench:eval-latency"]
depends = ["bench:run"]
run = "cargo run -p stop-benchmark --bin eval-latency -- --input data/benchmark_results.jsonl"
