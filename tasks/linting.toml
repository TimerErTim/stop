#:schema https://mise.jdx.dev/schema/mise-task.json

["lint:crates"]
description = "Check all rust crates"
usage = """
flag "--fix" env="STOP_LINT_FIX" help="Apply all lint suggestions"
flag "--allow-dirty" env="STOP_LINT_FIX_DIRTY" help="Allow dirty working directory"
"""
run = '''
#!/usr/bin/env bash
cargo clippy --workspace --all-targets \
  $([ "${usage_fix:-}" = "true" ] && echo "--fix") \
  $([ "${usage_fix:-}" = "true" ] && [ "${usage_allow_dirty:-}" = "true" ] && echo "--allow-dirty")
'''
