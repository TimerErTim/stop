[package]
name = "stop-gui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
readme.workspace = true
repository.workspace = true

[features]
default = ["mic"]
# Microphone STT (memo-stt / whisper-rs, cpal). Disable to build without
# the native audio stack, e.g. on CI.
mic = ["dep:memo-stt", "dep:cpal"]

[dependencies]
stop-core = { path = "../stop-core" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
eframe.workspace = true
tiny-skia.workspace = true
memo-stt = { version = "0.1", optional = true }
cpal = { version = "0.18", optional = true, features = ["pulseaudio"] }
